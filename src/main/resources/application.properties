spring.application.name=safebox

#H2 Config

spring.datasource.url=jdbc:h2:mem:safebox;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.show-sql=true


#Debug
logging.level.org.thymeleaf=DEBUG
logging.level.org.springframework.web.servlet.view=DEBUG

# Master key para cifrado (leída desde variable de entorno)
safebox.master-key=${SAFEBOX_MASTER_KEY}
safebox.admin.email=${SAFEBOX_ADMIN_EMAIL:}
safebox.admin.password=${SAFEBOX_ADMIN_PASSWORD:}
