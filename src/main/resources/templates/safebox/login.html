<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Login - SafeBox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="login-page">

  <div class="login-card">
    <h2 class="login-title">SafeBox Login</h2>

    <div class="error" th:if="${param.error}">Usuario o contraseña incorrectos</div>
    <div class="error" th:if="${param.logout}">Sesión cerrada correctamente</div>

    <div class="error"
         th:if="${session.SPRING_SECURITY_LAST_EXCEPTION != null
                and session.SPRING_SECURITY_LAST_EXCEPTION.message == 'User is disabled'}">
      Tu usuario está inactivo. Por favor contacta al administrador.
    </div>

    <form class="login-form" th:action="@{/login}" method="post">
      <div class="row">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
      </div>

      <div class="row">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>

      <button type="submit">Ingresar</button>
    </form>
  </div>

</body>
</html>
